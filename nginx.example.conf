# Рабочий пример для /etc/nginx/sites-available/advokat-tuapse
# Канонический хост: https://advokat-tuapse.ru (без www)
#
# После правок:
#   sudo nginx -t && sudo systemctl reload nginx

# HTTP → канонический HTTPS (оба имени)
server {
    listen 80;
    listen [::]:80;
    server_name advokat-tuapse.ru www.advokat-tuapse.ru;

    # Certbot webroot (renewal без правок nginx)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/advokat-tuapse/dist;
        allow all;
    }

    location / {
        return 301 https://advokat-tuapse.ru$request_uri;
    }
}

# www HTTPS → apex HTTPS (главный SEO-редирект)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.advokat-tuapse.ru;

    ssl_certificate /etc/letsencrypt/live/advokat-tuapse.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/advokat-tuapse.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://advokat-tuapse.ru$request_uri;
}

# Основной сайт (только apex)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name advokat-tuapse.ru;

    root /var/www/advokat-tuapse/dist;
    index index.html;

    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/advokat-tuapse.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/advokat-tuapse.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Сжатие — критично для PageSpeed (JS ~500KB → ~130KB)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2;

    location = /sitemap.xml {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /feed.yml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        try_files /feed.yml =404;
    }

    # Fingerprinted Vite assets — immutable long cache
    location ^~ /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Self-hosted fonts
    location ^~ /fonts/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Static images / icons in dist root
    location ~* \.(?:js|css|woff2|svg|png|jpe?g|webp|gif|ico|map)$ {
        access_log off;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        # Без 301 на trailing slash: canonical/sitemap без слэша, nginx отдаёт $uri/index.html
        rewrite ^(.+)/$ $1 last;
        try_files $uri/index.html $uri /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }

    location /uploads/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=604800" always;
    }
}
